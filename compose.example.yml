# pi-backup next to the apps it backs up. Put OP_SERVICE_ACCOUNT_TOKEN in a
# .env file next to this one. Use the same project as the apps so the volume
# names match (here Pocket ID's volume is pocket-id-data).
services:
  pi-backup:
    # Tag = your Pocket ID version.
    image: ghcr.io/mfmseth/pi-backup:2.18.0
    restart: unless-stopped
    init: true
    environment:
      # Reads the R2 credentials (item cloudflare-r2-pi-backup), the age public
      # key (item pi-backup-age) and Pocket ID's ENCRYPTION_KEY from 1Password.
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN}
      OP_VAULT: homelab
      KEEP: "14"
      BACKUP_SCHEDULE: "15 7 * * *"
      # PUSH_URL: https://uptime.example.com/api/push/<token>?status=up&msg=OK
    volumes:
      - pocket-id-data:/pocket-id/data
      - /etc/dns:/etc/dns

volumes:
  pocket-id-data:
